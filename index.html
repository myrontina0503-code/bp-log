<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#2564b0">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>血壓記錄</title>
<style>
:root {
  --page: #f2f4f6;
  --surface: #fdfefe;
  --sunken: #eaedf0;
  --ink: #14181d;
  --ink2: #4d565f;
  --muted: #838d96;
  --hair: rgba(20,24,29,0.10);
  --grid: #e2e6ea;
  --base: #c7ccd1;
  --accent: #2564b0;
  --accent-soft: rgba(37,100,176,0.10);
  --on-accent: #ffffff;
  --danger: #c0392b;
  --sbp: #c0392b; --dbp: #2564b0; --pulse: #17936b;
  --ok: #1baf7a; --warn: #eda100; --bad: #e34948; --crisis: #a72020;
}
@media (prefers-color-scheme: dark) {
  :root {
    --page: #101317; --surface: #1a1e23; --sunken: #23282e;
    --ink: #f1f3f5; --ink2: #c2c9cf; --muted: #8b939b;
    --hair: rgba(255,255,255,0.11); --grid: #2a2f35; --base: #3a4048;
    --accent: #5b9bde; --accent-soft: rgba(91,155,222,0.16); --on-accent: #0c1116;
    --danger: #e66767;
    --sbp: #e57468; --dbp: #5b9bde; --pulse: #4cc79a;
    --ok: #1baf7a; --warn: #c98500; --bad: #e66767; --crisis: #ff6b6b;
  }
}
:root[data-theme="dark"] {
  --page: #101317; --surface: #1a1e23; --sunken: #23282e;
  --ink: #f1f3f5; --ink2: #c2c9cf; --muted: #8b939b;
  --hair: rgba(255,255,255,0.11); --grid: #2a2f35; --base: #3a4048;
  --accent: #5b9bde; --accent-soft: rgba(91,155,222,0.16); --on-accent: #0c1116;
  --danger: #e66767;
  --sbp: #e57468; --dbp: #5b9bde; --pulse: #4cc79a;
  --ok: #1baf7a; --warn: #c98500; --bad: #e66767; --crisis: #ff6b6b;
}
:root[data-theme="light"] {
  --page: #f2f4f6; --surface: #fdfefe; --sunken: #eaedf0;
  --ink: #14181d; --ink2: #4d565f; --muted: #838d96;
  --hair: rgba(20,24,29,0.10); --grid: #e2e6ea; --base: #c7ccd1;
  --accent: #2564b0; --accent-soft: rgba(37,100,176,0.10); --on-accent: #ffffff;
  --danger: #c0392b;
  --sbp: #c0392b; --dbp: #2564b0; --pulse: #17936b;
  --ok: #1baf7a; --warn: #eda100; --bad: #e34948; --crisis: #a72020;
}

* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; touch-action: manipulation; }
html, body { background: var(--page); }
body {
  font-family: system-ui, -apple-system, "PingFang TC", "Segoe UI", "Microsoft JhengHei", sans-serif;
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; background:none; border:none; cursor:pointer; }
input, select, textarea { font: inherit; color: var(--ink); }

#app { max-width: 520px; margin: 0 auto; min-height: 100dvh; display:flex; flex-direction:column; }
.topbar { display:flex; align-items:baseline; justify-content:space-between; padding: 18px 16px 10px; }
.topbar h1 { font-size: 20px; font-weight: 800; letter-spacing: .03em; }
.topbar .date { font-size: 12px; color: var(--muted); }
main { flex:1; padding: 4px 14px calc(84px + env(safe-area-inset-bottom)); }

.tabbar {
  position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
  width: 100%; max-width: 520px; display: flex;
  background: var(--surface); border-top: 1px solid var(--hair);
  padding-bottom: env(safe-area-inset-bottom); z-index: 20;
}
.tabbar button { flex:1; display:flex; flex-direction:column; align-items:center; gap:2px; padding: 9px 0 7px; font-size: 11px; color: var(--muted); font-weight:600; }
.tabbar button .ic { font-size: 20px; line-height:1; filter: grayscale(1) opacity(.55); }
.tabbar button.on { color: var(--accent); }
.tabbar button.on .ic { filter:none; }

.card { background: var(--surface); border: 1px solid var(--hair); border-radius: 14px; padding: 14px; margin-bottom: 12px; }
.card h2 { font-size: 13px; font-weight: 700; color: var(--ink2); margin-bottom: 10px; letter-spacing:.04em; }
.hint { font-size: 13px; color: var(--muted); line-height: 1.6; }
.section-label { font-size: 12px; color: var(--muted); margin: 2px 2px 8px; letter-spacing:.05em; }

.chips { display:flex; gap:8px; overflow-x:auto; padding: 2px; scrollbar-width:none; flex-wrap: wrap; }
.chips::-webkit-scrollbar { display:none; }
.chip { flex:none; display:flex; align-items:center; gap:6px; padding: 8px 14px; border-radius: 999px; background: var(--sunken); border: 1.5px solid transparent; font-size: 14px; font-weight: 600; color: var(--ink2); }
.chip.on { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
.chip .dot { width: 9px; height: 9px; border-radius: 50%; flex:none; }

.mrow { display:flex; gap:8px; overflow-x:auto; padding: 2px; scrollbar-width:none; }
.mrow::-webkit-scrollbar { display:none; }
.mchip { flex:none; display:flex; align-items:center; gap:8px; padding: 9px 16px; border-radius: 999px; background: var(--sunken); border: 1.5px solid transparent; font-size: 15px; font-weight: 700; color: var(--ink2); }
.mchip.on { border-color: var(--m-color, var(--accent)); background: color-mix(in srgb, var(--m-color, var(--accent)) 14%, transparent); color: var(--ink); }
.mchip .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--m-color, var(--accent)); flex:none; }

.stepper { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom: 10px; user-select:none; -webkit-user-select:none; }
.stepper .lbl { width: 64px; font-size: 13px; font-weight: 700; color: var(--ink2); flex:none; }
.stepper .btn { width: 46px; height: 46px; border-radius: 50%; flex:none; background: var(--sunken); border:1px solid var(--hair); font-size: 18px; font-weight: 700; color: var(--ink2); }
.stepper .val { flex:1; text-align:center; font-size: 30px; font-weight: 800; font-variant-numeric: tabular-nums; }
.stepper .unit { font-size: 12px; color: var(--muted); font-weight: 600; margin-left: 4px; }

.photo-row { display:flex; align-items:center; gap:10px; }
.photo-thumb { width: 64px; height: 64px; border-radius: 10px; object-fit:cover; background: var(--sunken); flex:none; border:1px solid var(--hair); }
.photo-btn { flex:1; display:flex; align-items:center; justify-content:center; gap:6px; height: 64px; border-radius: 10px; background: var(--sunken); border: 1px dashed var(--base); color: var(--ink2); font-size: 13px; font-weight: 600; }
.photo-remove { font-size: 12px; color: var(--danger); font-weight:700; padding: 8px; }

textarea.note { width:100%; background: var(--sunken); border:1px solid var(--hair); border-radius: 10px; padding: 10px 12px; font-size: 14px; resize: vertical; min-height: 44px; }

.save-btn { width:100%; padding: 14px; border-radius: 12px; background: var(--accent); color: var(--on-accent); font-size: 16px; font-weight: 800; margin-top: 4px; }
.save-btn:disabled { opacity: .4; }

.time-input { width:100%; padding: 12px; border-radius: 10px; background: var(--sunken); border: 1px solid var(--hair); font-size: 15px; font-variant-numeric: tabular-nums; color-scheme: light dark; }
.elderly-note { font-size: 12px; color: var(--muted); margin-top: 6px; line-height:1.5; }
.demo-row { display:flex; gap:8px; }
.demo-row input[type="number"] { width: 88px; flex:none; padding: 10px 12px; border-radius: 10px; background: var(--sunken); border:1px solid var(--hair); }
.demo-row .chips { flex:1; }
.member-item .demo { font-size: 11px; color: var(--muted); margin-left: 6px; font-weight:600; }

.rec { display:flex; align-items:center; gap:12px; padding: 12px 4px; border-bottom: 1px solid var(--hair); }
.rec:last-child { border-bottom:none; }
.rec .badge { width: 10px; height: 10px; border-radius: 50%; flex:none; }
.rec .main { flex:1; min-width:0; }
.rec .nums { font-size: 17px; font-weight: 800; font-variant-numeric: tabular-nums; }
.rec .nums .slash { color: var(--muted); font-weight: 600; margin: 0 2px; }
.rec .nums .pulse { font-size: 13px; color: var(--muted); font-weight: 600; margin-left: 8px; }
.rec .meta { font-size: 12px; color: var(--muted); margin-top: 2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.rec .thumb { width: 44px; height: 44px; border-radius: 8px; object-fit:cover; flex:none; }
.rec .chev { color: var(--muted); font-size: 13px; }

.filter-row { display:flex; gap:8px; margin-bottom: 10px; }
.filter-row select { flex:1; padding: 9px 10px; border-radius: 10px; background: var(--sunken); border:1px solid var(--hair); }

.stat-grid { display:grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 8px; margin-bottom: 12px; }
.stat { background: var(--sunken); border-radius: 12px; padding: 10px 4px; text-align:center; min-width:0; }
.stat .n { font-size: 18px; font-weight: 800; font-variant-numeric: tabular-nums; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.stat .l { font-size: 11px; color: var(--muted); margin-top: 2px; }

.legend { display:flex; gap:14px; font-size: 12px; color: var(--ink2); margin-bottom: 6px; }
.legend .sw { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:5px; }

.empty { text-align:center; padding: 40px 12px; color: var(--muted); font-size: 13px; }

.member-list { display:flex; flex-direction:column; gap:8px; }
.member-item { display:flex; align-items:center; gap:10px; padding: 10px; background: var(--sunken); border-radius: 10px; }
.member-item .dot { width: 14px; height:14px; border-radius:50%; flex:none; }
.member-item .nm { flex:1; font-size:14px; font-weight:700; }
.member-item .del { color: var(--danger); font-size: 12px; font-weight:700; padding: 6px; }
.color-pick { display:flex; gap:8px; margin: 8px 0; flex-wrap:wrap; }
.color-pick .sw { width: 26px; height: 26px; border-radius: 50%; border: 2px solid transparent; }
.color-pick .sw.on { border-color: var(--ink); }
.add-row { display:flex; gap:8px; margin-top: 8px; }
.add-row input { flex:1; padding: 10px 12px; border-radius: 10px; background: var(--sunken); border:1px solid var(--hair); }
.add-row button { padding: 10px 16px; border-radius: 10px; background: var(--accent); color: var(--on-accent); font-weight:700; font-size:13px; }

.io-row { display:flex; gap:8px; }
.io-row button { flex:1; padding: 11px; border-radius: 10px; background: var(--sunken); border:1px solid var(--hair); font-size: 13px; font-weight:700; color: var(--ink2); }

dialog { border:none; border-radius: 16px; padding:0; background: var(--surface); color: var(--ink); width: 92%; max-width: 440px; }
dialog::backdrop { background: rgba(0,0,0,.4); }
.dlg-body { padding: 18px; max-height: 80dvh; overflow:auto; }
.dlg-title { font-size: 16px; font-weight:800; margin-bottom: 12px; }
.dlg-actions { display:flex; gap:8px; margin-top: 16px; }
.dlg-actions button { flex:1; padding: 11px; border-radius: 10px; font-size: 14px; font-weight:700; }
.dlg-actions .cancel { background: var(--sunken); color: var(--ink2); }
.dlg-actions .ok { background: var(--accent); color: var(--on-accent); }
.dlg-actions .ok.danger { background: var(--danger); }
.dlg-photo { width:100%; border-radius: 10px; margin-bottom: 12px; display:block; }

canvas.chart { width:100%; height: 220px; display:block; }
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <h1 id="topTitle">血壓記錄</h1>
    <div class="date" id="topDate"></div>
  </div>
  <main id="main"></main>
  <div class="tabbar">
    <button data-tab="entry" class="on"><span class="ic">✚</span>記錄</button>
    <button data-tab="history"><span class="ic">☰</span>歷史</button>
    <button data-tab="stats"><span class="ic">📈</span>統計</button>
    <button data-tab="settings"><span class="ic">⚙</span>設定</button>
  </div>
</div>
<dialog id="dlg"><div class="dlg-body" id="dlgBody"></div></dialog>
<input type="file" id="photoInput" accept="image/*" capture="environment" style="display:none">
<script>
'use strict';

/* ---------- IndexedDB ---------- */
const DB_NAME='bp-log', STORE='kv', KEY='state';
function idbOpen(){
  return new Promise((res,rej)=>{
    const r = indexedDB.open(DB_NAME, 1);
    r.onupgradeneeded = ()=> r.result.createObjectStore(STORE);
    r.onsuccess = ()=> res(r.result);
    r.onerror = ()=> rej(r.error);
  });
}
async function idbGet(key){
  const db = await idbOpen();
  return new Promise((res,rej)=>{
    const tx = db.transaction(STORE,'readonly');
    const rq = tx.objectStore(STORE).get(key);
    rq.onsuccess = ()=> res(rq.result);
    rq.onerror = ()=> rej(rq.error);
  });
}
async function idbSet(key,val){
  const db = await idbOpen();
  return new Promise((res,rej)=>{
    const tx = db.transaction(STORE,'readwrite');
    tx.objectStore(STORE).put(val,key);
    tx.oncomplete = ()=> res();
    tx.onerror = ()=> rej(tx.error);
  });
}

/* ---------- State ---------- */
const COLORS = ['#2564b0','#c0392b','#17936b','#8a5cd1','#d18a1c','#c25a9e'];
const TIME_TAGS = ['早上起床','早餐前','早餐後','午餐前','午餐後','晚餐前','晚餐後','睡前','其他'];

let state = { members: [], records: [] };
let ui = { tab:'entry', entry:null, historyFilter:'all', photoTargetDataUrl:null };

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

async function loadState(){
  const s = await idbGet(KEY);
  if (s && s.members && s.members.length){
    state = s;
  } else {
    state = { members: [{id:uid(), name:'我', color: COLORS[0]}], records: [] };
    await saveState();
  }
  if (!ui.entry) resetEntry();
}
let saveTimer=null;
function saveState(){
  clearTimeout(saveTimer);
  return new Promise(res=>{
    saveTimer = setTimeout(async ()=>{ await idbSet(KEY, state); res(); }, 120);
  });
}

function resetEntry(){
  const lastMember = state.members[0]?.id || null;
  ui.entry = { memberId: lastMember, timeTag: guessTimeTag(), customTag:'', sbp:120, dbp:80, pulse:70, note:'', photo:null, ts: Date.now() };
}
function tsToLocalInput(ts){
  const d = new Date(ts);
  const pad = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function localInputToTs(str){
  const t = new Date(str).getTime();
  return isNaN(t) ? Date.now() : t;
}
function guessTimeTag(){
  const h = new Date().getHours();
  if (h < 9) return '早上起床';
  if (h < 11) return '早餐後';
  if (h < 14) return '午餐後';
  if (h < 18) return '晚餐前';
  if (h < 22) return '晚餐後';
  return '睡前';
}

/* ---------- BP category ---------- */
function bpCategory(sbp,dbp){
  if (sbp>=180 || dbp>=120) return {label:'高血壓危象', color:'var(--crisis)'};
  if (sbp>=140 || dbp>=90) return {label:'高血壓第2期', color:'var(--bad)'};
  if (sbp>=130 || dbp>=80) return {label:'高血壓第1期', color:'var(--warn)'};
  if (sbp>=120) return {label:'血壓偏高', color:'var(--warn)'};
  return {label:'正常', color:'var(--ok)'};
}
function elderlyNote(age){
  if (age!=null && age>=65) return '65 歲以上長者,控制目標可能因醫囑而較一般標準寬鬆,分級僅供參考。';
  return '';
}
function genderLabel(g){ return g==='F'?'女':g==='M'?'男':g?'其他':''; }
function memberDemoText(m){
  const parts = [];
  if (m.age!=null) parts.push(m.age+'歲');
  if (genderLabel(m.gender)) parts.push(genderLabel(m.gender));
  return parts.length ? ` <span style="font-size:11px;color:var(--muted);font-weight:600">(${parts.join('・')})</span>` : '';
}

/* ---------- Photo helpers ---------- */
function resizeImage(file, maxDim=900, quality=0.72){
  return new Promise((resolve,reject)=>{
    const img = new Image();
    const reader = new FileReader();
    reader.onload = ()=>{ img.onload = ()=>{
      let {width:w, height:h} = img;
      if (w>h && w>maxDim){ h = h*maxDim/w; w = maxDim; }
      else if (h>=w && h>maxDim){ w = w*maxDim/h; h = maxDim; }
      const c = document.createElement('canvas');
      c.width = Math.round(w); c.height = Math.round(h);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      resolve(c.toDataURL('image/jpeg', quality));
    }; img.onerror = reject; img.src = reader.result; };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* ---------- Render root ---------- */
function fmtDate(ts){
  const d = new Date(ts);
  return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}
function memberById(id){ return state.members.find(m=>m.id===id); }

function render(){
  document.getElementById('topDate').textContent = new Date().toLocaleDateString('zh-TW',{month:'long',day:'numeric',weekday:'short'});
  document.querySelectorAll('.tabbar button').forEach(b=>b.classList.toggle('on', b.dataset.tab===ui.tab));
  const main = document.getElementById('main');
  if (ui.tab==='entry') main.innerHTML = renderEntry();
  else if (ui.tab==='history') main.innerHTML = renderHistory();
  else if (ui.tab==='stats') main.innerHTML = renderStats();
  else main.innerHTML = renderSettings();
  bindTabEvents();
  if (ui.tab==='stats') drawAllCharts();
}

/* ---------- Entry tab ---------- */
function renderEntry(){
  if (!state.members.length){
    return `<div class="empty">請先到「設定」新增至少一位成員</div>`;
  }
  const e = ui.entry;
  const mchips = state.members.map(m=>`
    <button class="mchip ${m.id===e.memberId?'on':''}" style="--m-color:${m.color}" data-act="pick-member" data-id="${m.id}">
      <span class="dot"></span>${escapeHtml(m.name)}
    </button>`).join('');
  const tchips = TIME_TAGS.map(t=>`
    <button class="chip ${e.timeTag===t?'on':''}" data-act="pick-time" data-tag="${t}">${t}</button>`).join('');
  const customTagBlock = e.timeTag==='其他'
    ? `<input class="time-input" id="customTagInput" style="margin-top:8px" placeholder="輸入自訂時段,例如:運動後" value="${escapeHtml(e.customTag)}">`
    : '';
  const member = memberById(e.memberId);
  const cat = bpCategory(e.sbp, e.dbp);
  const eNote = member ? elderlyNote(member.age) : '';
  const photoBlock = e.photo
    ? `<div class="photo-row"><img class="photo-thumb" src="${e.photo}"><div class="hint" style="flex:1">已附上照片,存查用</div><button class="photo-remove" data-act="remove-photo">移除</button></div>`
    : `<div class="photo-row"><button class="photo-btn" data-act="take-photo">📷 拍照存查(選填)</button></div>`;

  return `
  <div class="card">
    <h2>成員</h2>
    <div class="mrow">${mchips}</div>
  </div>
  <div class="card">
    <h2>時段</h2>
    <div class="chips">${tchips}</div>
    ${customTagBlock}
  </div>
  <div class="card">
    <h2>時間點</h2>
    <input type="datetime-local" class="time-input" id="tsInput" value="${tsToLocalInput(e.ts)}">
  </div>
  <div class="card entry">
    <h2>數值 <span style="float:right;color:${cat.color};font-weight:700">${cat.label}</span></h2>
    ${stepperRow('收縮壓','sbp',e.sbp,'mmHg',1)}
    ${stepperRow('舒張壓','dbp',e.dbp,'mmHg',1)}
    ${stepperRow('脈搏','pulse',e.pulse,'次/分',1)}
    ${eNote ? `<div class="elderly-note">${eNote}</div>` : ''}
  </div>
  <div class="card">
    <h2>照片</h2>
    ${photoBlock}
  </div>
  <div class="card">
    <h2>備註(選填)</h2>
    <textarea class="note" id="noteInput" placeholder="例如:剛運動完、量錯重量一次…">${escapeHtml(e.note)}</textarea>
  </div>
  <button class="save-btn" data-act="save-entry">儲存記錄</button>
  `;
}
function stepperRow(label,key,val,unit,step){
  return `<div class="stepper" data-key="${key}">
    <div class="lbl">${label}</div>
    <button class="btn" data-act="step" data-key="${key}" data-d="-1">−</button>
    <div class="val">${val}<span class="unit">${unit}</span></div>
    <button class="btn" data-act="step" data-key="${key}" data-d="1">＋</button>
  </div>`;
}

/* ---------- History tab ---------- */
function renderHistory(){
  const opts = `<option value="all">全部成員</option>` + state.members.map(m=>`<option value="${m.id}" ${ui.historyFilter===m.id?'selected':''}>${escapeHtml(m.name)}</option>`).join('');
  let recs = [...state.records].sort((a,b)=>b.ts-a.ts);
  if (ui.historyFilter!=='all') recs = recs.filter(r=>r.memberId===ui.historyFilter);
  const rows = recs.map(r=>{
    const m = memberById(r.memberId);
    const cat = bpCategory(r.sbp,r.dbp);
    const thumb = r.photo ? `<img class="thumb" src="${r.photo}">` : '';
    return `<div class="rec" data-act="open-record" data-id="${r.id}">
      <span class="badge" style="background:${cat.color}"></span>
      <div class="main">
        <div class="nums">${r.sbp}<span class="slash">/</span>${r.dbp}<span class="pulse">♥${r.pulse}</span></div>
        <div class="meta">${escapeHtml(m?m.name:'')} · ${r.timeTag} · ${fmtDate(r.ts)}${r.note?' · '+escapeHtml(r.note):''}</div>
      </div>
      ${thumb}
      <span class="chev">›</span>
    </div>`;
  }).join('');
  return `
  <div class="filter-row"><select id="histFilter">${opts}</select></div>
  <div class="card">${rows || '<div class="empty">還沒有記錄</div>'}</div>
  `;
}

/* ---------- Stats tab ---------- */
function renderStats(){
  if (!state.members.length) return `<div class="empty">請先新增成員</div>`;
  return state.members.map(m=>{
    const recs = state.records.filter(r=>r.memberId===m.id).sort((a,b)=>a.ts-b.ts);
    if (!recs.length){
      return `<div class="card"><h2><span class="dot" style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${m.color};margin-right:6px"></span>${escapeHtml(m.name)}${memberDemoText(m)}</h2><div class="empty">尚無記錄</div></div>`;
    }
    const sbps = recs.map(r=>r.sbp), dbps = recs.map(r=>r.dbp);
    const avg = arr => Math.round(arr.reduce((a,b)=>a+b,0)/arr.length);
    const last = recs[recs.length-1];
    return `<div class="card">
      <h2><span class="dot" style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${m.color};margin-right:6px"></span>${escapeHtml(m.name)}${memberDemoText(m)}(${recs.length} 筆)</h2>
      <div class="stat-grid">
        <div class="stat"><div class="n">${last.sbp}/${last.dbp}</div><div class="l">最近一次</div></div>
        <div class="stat"><div class="n">${avg(sbps)}/${avg(dbps)}</div><div class="l">平均</div></div>
        <div class="stat"><div class="n">${Math.max(...sbps)}/${Math.max(...dbps)}</div><div class="l">最高</div></div>
      </div>
      ${elderlyNote(m.age) ? `<div class="elderly-note">${elderlyNote(m.age)}</div>` : ''}
      <div class="legend"><span><span class="sw" style="background:var(--sbp)"></span>收縮壓</span><span><span class="sw" style="background:var(--dbp)"></span>舒張壓</span></div>
      <canvas class="chart" id="chart-${m.id}"></canvas>
    </div>`;
  }).join('');
}
function drawAllCharts(){
  state.members.forEach(m=>{
    const cv = document.getElementById('chart-'+m.id);
    if (!cv) return;
    const recs = state.records.filter(r=>r.memberId===m.id).sort((a,b)=>a.ts-b.ts).slice(-30);
    drawChart(cv, recs);
  });
}
function drawChart(canvas, recs){
  const dpr = window.devicePixelRatio||1;
  const rect = canvas.getBoundingClientRect();
  const w = rect.width||300, h = 220;
  canvas.width = w*dpr; canvas.height = h*dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr,dpr);
  ctx.clearRect(0,0,w,h);
  if (recs.length<1) return;
  const pad = {l:34,r:10,t:14,b:22};
  const vals = recs.flatMap(r=>[r.sbp,r.dbp]);
  let vmin = Math.min(...vals)-8, vmax = Math.max(...vals)+8;
  vmin = Math.floor(vmin/10)*10; vmax = Math.ceil(vmax/10)*10;
  const cssInk2 = getComputedStyle(document.documentElement).getPropertyValue('--ink2').trim();
  const cssGrid = getComputedStyle(document.documentElement).getPropertyValue('--grid').trim();
  const cssSbp = getComputedStyle(document.documentElement).getPropertyValue('--sbp').trim();
  const cssDbp = getComputedStyle(document.documentElement).getPropertyValue('--dbp').trim();
  const x = i => pad.l + (recs.length===1?0:(w-pad.l-pad.r)*i/(recs.length-1));
  const y = v => h-pad.b - (h-pad.t-pad.b)*(v-vmin)/(vmax-vmin);
  ctx.strokeStyle = cssGrid; ctx.fillStyle = cssInk2; ctx.font = '10px system-ui'; ctx.lineWidth=1;
  for (let gv=vmin; gv<=vmax; gv+=20){
    const gy = y(gv);
    ctx.beginPath(); ctx.moveTo(pad.l,gy); ctx.lineTo(w-pad.r,gy); ctx.stroke();
    ctx.fillText(String(gv), 2, gy+3);
  }
  function drawLine(key,color){
    ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.beginPath();
    recs.forEach((r,i)=>{ const px=x(i), py=y(r[key]); if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py); });
    ctx.stroke();
    ctx.fillStyle = color;
    recs.forEach((r,i)=>{ ctx.beginPath(); ctx.arc(x(i), y(r[key]), 2.6, 0, 7); ctx.fill(); });
  }
  drawLine('dbp', cssDbp);
  drawLine('sbp', cssSbp);
  ctx.fillStyle = cssInk2;
  const step = Math.max(1, Math.round(recs.length/4));
  recs.forEach((r,i)=>{ if (i%step===0 || i===recs.length-1){ const d=new Date(r.ts); ctx.fillText(`${d.getMonth()+1}/${d.getDate()}`, x(i)-10, h-6); } });
}

/* ---------- Settings tab ---------- */
function renderSettings(){
  const items = state.members.map(m=>`
    <div class="member-item">
      <span class="dot" style="background:${m.color}"></span>
      <span class="nm">${escapeHtml(m.name)}${m.age!=null?`<span class="demo">${m.age}歲</span>`:''}${genderLabel(m.gender)?`<span class="demo">${genderLabel(m.gender)}</span>`:''}</span>
      <button class="del" data-act="del-member" data-id="${m.id}">刪除</button>
    </div>`).join('');
  const canAdd = state.members.length < 3;
  return `
  <div class="card">
    <h2>成員(最多 3 位)</h2>
    <div class="member-list">${items || '<div class="empty">尚無成員</div>'}</div>
    ${canAdd ? `
    <div class="section-label" style="margin-top:12px">新增成員</div>
    <div class="add-row" style="margin-bottom:8px"><input id="newMemberName" placeholder="姓名"></div>
    <div class="demo-row" style="margin-bottom:8px">
      <input id="newMemberAge" type="number" inputmode="numeric" min="0" max="120" placeholder="年齡">
      <div class="chips" id="genderPick">
        <button class="chip on" data-gender="">不填</button>
        <button class="chip" data-gender="M">男</button>
        <button class="chip" data-gender="F">女</button>
      </div>
    </div>
    <div class="section-label">顏色</div>
    <div class="color-pick" id="colorPick">${COLORS.map((c,i)=>`<span class="sw ${i===0?'on':''}" data-color="${c}" style="background:${c}"></span>`).join('')}</div>
    <div class="add-row"><button data-act="add-member" style="width:100%;text-align:center">新增成員</button></div>
    ` : `<div class="hint" style="margin-top:8px">已達 3 位上限,如需更換請先刪除</div>`}
  </div>
  <div class="card">
    <h2>資料備份</h2>
    <div class="hint" style="margin-bottom:10px">記錄與照片都存在這台裝置的瀏覽器裡,清除瀏覽器資料會遺失。建議定期匯出備份。</div>
    <div class="io-row">
      <button data-act="export-json">匯出 JSON</button>
      <button data-act="import-json">匯入 JSON</button>
    </div>
  </div>
  <div class="card">
    <h2>血壓分級參考(衛福部/AHA)</h2>
    <div class="hint">
      正常:&lt;120 / &lt;80　　血壓偏高:120-129 / &lt;80<br>
      高血壓第1期:130-139 或 80-89　　高血壓第2期:≥140 或 ≥90<br>
      高血壓危象:≥180 或 ≥120(建議儘速就醫)<br>
      以上分級為一般成人通用標準,實際仍會因年齡、性別、懷孕與其他病史而不同,僅供記錄參考,非醫療診斷。
    </div>
  </div>
  `;
}

/* ---------- Events ---------- */
function escapeHtml(s){ return String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function bindTabEvents(){
  const main = document.getElementById('main');
  main.onclick = async (ev)=>{
    const t = ev.target.closest('[data-act]');
    if (!t) return;
    const act = t.dataset.act;
    if (act==='pick-member'){ ui.entry.memberId = t.dataset.id; render(); }
    else if (act==='pick-time'){ ui.entry.timeTag = t.dataset.tag; render(); }
    else if (act==='step'){
      const key = t.dataset.key, d = parseInt(t.dataset.d,10);
      const min = key==='pulse'?30:(key==='dbp'?30:50);
      const max = key==='pulse'?220:(key==='dbp'?150:250);
      ui.entry[key] = Math.max(min, Math.min(max, ui.entry[key]+d));
      render();
    }
    else if (act==='take-photo'){ document.getElementById('photoInput').click(); }
    else if (act==='remove-photo'){ ui.entry.photo = null; render(); }
    else if (act==='save-entry'){ await saveEntry(); }
    else if (act==='open-record'){ openRecordDialog(t.dataset.id); }
    else if (act==='add-member'){ addMember(); }
    else if (act==='del-member'){ delMember(t.dataset.id); }
    else if (act==='export-json'){ exportJson(); }
    else if (act==='import-json'){ importJson(); }
  };
  const note = document.getElementById('noteInput');
  if (note) note.oninput = ()=>{ ui.entry.note = note.value; };
  const tsInput = document.getElementById('tsInput');
  if (tsInput) tsInput.onchange = ()=>{ ui.entry.ts = localInputToTs(tsInput.value); };
  const customTagInput = document.getElementById('customTagInput');
  if (customTagInput) customTagInput.oninput = ()=>{ ui.entry.customTag = customTagInput.value; };
  const cp = document.getElementById('colorPick');
  if (cp) cp.onclick = (ev)=>{ const sw = ev.target.closest('.sw'); if(!sw) return; cp.querySelectorAll('.sw').forEach(s=>s.classList.remove('on')); sw.classList.add('on'); };
  const gp = document.getElementById('genderPick');
  if (gp) gp.onclick = (ev)=>{ const b = ev.target.closest('button'); if(!b) return; gp.querySelectorAll('button').forEach(x=>x.classList.remove('on')); b.classList.add('on'); };
  const histFilter = document.getElementById('histFilter');
  if (histFilter) histFilter.onchange = ()=>{ ui.historyFilter = histFilter.value; render(); };
}

document.getElementById('photoInput').addEventListener('change', async (e)=>{
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;
  try {
    const dataUrl = await resizeImage(file);
    ui.entry.photo = dataUrl;
    render();
  } catch(err){ alert('照片讀取失敗,請再試一次'); }
});

async function saveEntry(){
  const e = ui.entry;
  if (!e.memberId){ alert('請選擇成員'); return; }
  const timeTag = (e.timeTag==='其他' && e.customTag.trim()) ? e.customTag.trim() : e.timeTag;
  state.records.push({
    id: uid(), memberId: e.memberId, timeTag,
    sbp: e.sbp, dbp: e.dbp, pulse: e.pulse, note: e.note.trim(),
    photo: e.photo, ts: e.ts
  });
  await saveState();
  resetEntry();
  ui.tab = 'history';
  render();
  const main = document.getElementById('main');
  main.scrollTop = 0;
}

function addMember(){
  const input = document.getElementById('newMemberName');
  const name = input.value.trim();
  if (!name) { input.focus(); return; }
  if (state.members.length>=3) return;
  const sw = document.querySelector('#colorPick .sw.on');
  const color = sw ? sw.dataset.color : COLORS[state.members.length % COLORS.length];
  const ageInput = document.getElementById('newMemberAge');
  const ageVal = ageInput && ageInput.value.trim() ? parseInt(ageInput.value,10) : null;
  const genderBtn = document.querySelector('#genderPick button.on');
  const gender = genderBtn ? genderBtn.dataset.gender : '';
  state.members.push({ id: uid(), name, color, age: (ageVal!=null && !isNaN(ageVal)) ? ageVal : null, gender: gender || null });
  saveState();
  render();
}
function delMember(id){
  const m = memberById(id);
  if (!m) return;
  const hasRecs = state.records.some(r=>r.memberId===id);
  const msg = hasRecs ? `刪除「${m.name}」會一併刪除其所有記錄,確定嗎?` : `確定刪除「${m.name}」?`;
  confirmDialog(msg, async ()=>{
    state.members = state.members.filter(x=>x.id!==id);
    state.records = state.records.filter(r=>r.memberId!==id);
    if (ui.entry.memberId===id) resetEntry();
    await saveState();
    render();
  });
}

/* ---------- Record detail dialog ---------- */
function openRecordDialog(id){
  const r = state.records.find(x=>x.id===id);
  if (!r) return;
  const m = memberById(r.memberId);
  const cat = bpCategory(r.sbp,r.dbp);
  const dlg = document.getElementById('dlg');
  document.getElementById('dlgBody').innerHTML = `
    <div class="dlg-title">${escapeHtml(m?m.name:'')}${m?memberDemoText(m):''} · ${r.timeTag}</div>
    ${r.photo?`<img class="dlg-photo" src="${r.photo}">`:''}
    <div class="stat-grid">
      <div class="stat"><div class="n">${r.sbp}</div><div class="l">收縮壓</div></div>
      <div class="stat"><div class="n">${r.dbp}</div><div class="l">舒張壓</div></div>
      <div class="stat"><div class="n">${r.pulse}</div><div class="l">脈搏</div></div>
    </div>
    <div class="hint">分級:<b style="color:${cat.color}">${cat.label}</b></div>
    <div class="hint">時間:${fmtDate(r.ts)}</div>
    ${r.note?`<div class="hint">備註:${escapeHtml(r.note)}</div>`:''}
    ${m && elderlyNote(m.age) ? `<div class="elderly-note">${elderlyNote(m.age)}</div>` : ''}
    <div class="dlg-actions">
      <button class="cancel" id="dlgClose">關閉</button>
      <button class="ok danger" id="dlgDelete">刪除</button>
    </div>
  `;
  dlg.showModal();
  document.getElementById('dlgClose').onclick = ()=> dlg.close();
  document.getElementById('dlgDelete').onclick = ()=>{
    dlg.close();
    confirmDialog('確定刪除這筆記錄?', async ()=>{
      state.records = state.records.filter(x=>x.id!==id);
      await saveState();
      render();
    });
  };
}
function confirmDialog(msg, onOk){
  const dlg = document.getElementById('dlg');
  document.getElementById('dlgBody').innerHTML = `
    <div class="dlg-title">確認</div>
    <div class="hint">${escapeHtml(msg)}</div>
    <div class="dlg-actions">
      <button class="cancel" id="dlgCancel">取消</button>
      <button class="ok danger" id="dlgOk">確定</button>
    </div>`;
  dlg.showModal();
  document.getElementById('dlgCancel').onclick = ()=> dlg.close();
  document.getElementById('dlgOk').onclick = ()=>{ dlg.close(); onOk(); };
}

/* ---------- Backup ---------- */
function exportJson(){
  const blob = new Blob([JSON.stringify(state,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const d = new Date();
  a.href = url;
  a.download = `血壓記錄備份_${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 5000);
}
function importJson(){
  const input = document.createElement('input');
  input.type = 'file'; input.accept = 'application/json';
  input.onchange = async ()=>{
    const file = input.files[0];
    if (!file) return;
    try {
      const text = await file.text();
      const data = JSON.parse(text);
      if (!data.members || !data.records) throw new Error('格式不符');
      confirmDialog('匯入會覆蓋目前裝置上的所有記錄,確定嗎?', async ()=>{
        state = data;
        await saveState();
        render();
      });
    } catch(err){ alert('匯入失敗:檔案格式不正確'); }
  };
  input.click();
}

/* ---------- Tabbar ---------- */
document.querySelector('.tabbar').addEventListener('click', (e)=>{
  const b = e.target.closest('button');
  if (!b) return;
  ui.tab = b.dataset.tab;
  render();
});

/* ---------- Theme sync (matches host if embedded, else system) ---------- */
(function(){
  const mq = window.matchMedia('(prefers-color-scheme: dark)');
  mq.addEventListener?.('change', ()=>{});
})();

/* ---------- Boot ---------- */
loadState().then(render);

/* ---------- Service worker ---------- */
if ('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
